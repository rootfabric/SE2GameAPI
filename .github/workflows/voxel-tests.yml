name: Voxel contracts (no game DLLs)
on:
  push:
    branches: [feature/voxel-scan-service]
  pull_request:
    paths: ['src/Game/Voxels/**', 'src/Redis/VoxelRedisGateway.cs', 'examples/voxel_viewer.py', 'tests/VoxelTests/**', 'tests/test_voxel_viewer.py', '.github/workflows/voxel-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project tests/VoxelTests -c Release
      - run: dotnet build tests/VoxelApiProbe -c Release
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy matplotlib pytest
      - run: python -m pytest tests/test_voxel_viewer.py -q
        env:
          MPLBACKEND: Agg
